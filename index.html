<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>デイトレ計算</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --border: #252830;
    --green: #22c97a;
    --green-dim: rgba(34,201,122,0.1);
    --red: #e05555;
    --red-dim: rgba(224,85,85,0.1);
    --neutral-dim: rgba(160,168,191,0.07);
    --white: #e8eaf2;
    --muted: #555d72;
    --accent: #4b7bff;
  }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    min-height: 100svh;
    padding: 16px;
    padding-bottom: 40px;
  }
  h1 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .settings {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .setting-item {
    flex: 1;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .setting-label {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }
  .setting-input { display: flex; align-items: center; gap: 3px; }
  .setting-input input {
    background: none; border: none; outline: none;
    color: var(--white); font-size: 18px; font-weight: 700;
    width: 52px; -moz-appearance: textfield;
  }
  .setting-input input::-webkit-outer-spin-button,
  .setting-input input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .pct-label { font-size: 13px; color: var(--muted); }

  .cards { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }

  .card {
    border-radius: 14px;
    border: 1.5px solid var(--border);
    padding: 14px 16px;
    transition: border-color 0.12s;
  }
  .card.green  { background: var(--green-dim);   border-color: rgba(34,201,122,0.2); }
  .card.red    { background: var(--red-dim);      border-color: rgba(224,85,85,0.2); }
  .card.neutral{ background: var(--neutral-dim);  border-color: var(--border); }

  .card.active.green  { border-color: var(--green); }
  .card.active.red    { border-color: var(--red); }
  .card.active.neutral{ border-color: var(--accent); }

  .card-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .card-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .card.green  .card-label { color: var(--green); }
  .card.red    .card-label { color: var(--red); }
  .card.neutral .card-label{ color: #a0a8bf; }

  .card-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600;
  }
  .card.green  .card-badge { background: var(--green-dim); color: var(--green); }
  .card.red    .card-badge { background: var(--red-dim);   color: var(--red); }
  .card.neutral .card-badge{ background: rgba(160,168,191,0.1); color: #a0a8bf; }

  .card-input-row { display: flex; align-items: baseline; }
  .price-input {
    background: none; border: none; outline: none;
    font-size: 34px; font-weight: 700; color: var(--white);
    width: 100%; -moz-appearance: textfield; letter-spacing: -0.5px;
  }
  .price-input::placeholder { color: #2e3340; }
  .price-input::-webkit-outer-spin-button,
  .price-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .yen-label { font-size: 16px; color: var(--muted); margin-left: 3px; flex-shrink: 0; }

  .connector { display: none; }

  .shares-row {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .shares-label { font-size: 11px; color: var(--muted); font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
  .shares-input {
    background: none; border: none; outline: none;
    font-size: 26px; font-weight: 700; color: var(--white);
    width: 100%; text-align: right; -moz-appearance: textfield;
  }
  .shares-input::placeholder { color: #2e3340; }
  .shares-input::-webkit-outer-spin-button,
  .shares-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .shares-unit { font-size: 14px; color: var(--muted); flex-shrink: 0; }

  .maxloss-row {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .maxloss-label { font-size: 11px; color: var(--muted); font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
  .maxloss-input {
    background: none; border: none; outline: none;
    font-size: 26px; font-weight: 700; color: var(--red);
    width: 100%; text-align: right; -moz-appearance: textfield;
  }
  .maxloss-input::placeholder { color: #2e3340; }
  .maxloss-input::-webkit-outer-spin-button,
  .maxloss-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .maxloss-unit { font-size: 14px; color: var(--muted); flex-shrink: 0; }
  .maxloss-hint { display: none; }

  .pnl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .pnl-card { border-radius: 12px; padding: 12px 14px; text-align: center; }
  .pnl-card.profit { background: var(--green-dim); border: 0.5px solid rgba(34,201,122,0.18); }
  .pnl-card.loss   { background: var(--red-dim);   border: 0.5px solid rgba(224,85,85,0.18); }
  .pnl-title { font-size: 10px; color: var(--muted); margin-bottom: 5px; letter-spacing: 0.05em; }
  .pnl-value { font-size: 22px; font-weight: 700; }
  .pnl-card.profit .pnl-value { color: var(--green); }
  .pnl-card.loss   .pnl-value { color: var(--red); }

  .capital-row {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .capital-label { font-size: 11px; color: var(--muted); font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
  .capital-input {
    background: none; border: none; outline: none;
    font-size: 26px; font-weight: 700; color: var(--white);
    width: 100%; text-align: right; -moz-appearance: textfield;
  }
  .capital-input::placeholder { color: #2e3340; }
  .capital-input::-webkit-outer-spin-button,
  .capital-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .capital-unit { font-size: 14px; color: var(--muted); flex-shrink: 0; }

  .btn-clear {
    width: 100%; padding: 14px; background: var(--surface);
    border: 0.5px solid var(--border); border-radius: 12px;
    color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer;
    letter-spacing: 0.04em;
  }
  .btn-clear:active { opacity: 0.6; }
</style>
</head>
<body>

<h1>デイトレ 計算ツール</h1>

<div class="settings">
  <div class="setting-item">
    <div class="setting-label">利確 %</div>
    <div class="setting-input">
      <input type="number" id="profitPct" value="1.0" step="0.1" min="0.1" oninput="syncRatio('profit'); recalcFromSettings()">
      <span class="pct-label">%</span>
    </div>
  </div>
  <div class="setting-item">
    <div class="setting-label">損切り %</div>
    <div class="setting-input">
      <input type="number" id="stopPct" value="0.5" step="0.1" min="0.1" oninput="syncRatio('stop'); recalcFromSettings()">
      <span class="pct-label">%</span>
    </div>
  </div>
</div>

<div class="cards">
  <div class="card green" id="card-profit">
    <div class="card-header">
      <span class="card-label">利確ライン</span>
      <span class="card-badge" id="badge-profit">+1.0%</span>
    </div>
    <div class="card-input-row">
      <input class="price-input" type="number" id="inp-profit" placeholder="—" step="1"
             oninput="onInput('profit')" onfocus="onFocus('profit')">
      <span class="yen-label">円</span>
    </div>
  </div>

  <div class="connector">↕</div>

  <div class="card neutral active" id="card-entry">
    <div class="card-header">
      <span class="card-label">買値</span>
      <span class="card-badge" id="badge-entry">基準</span>
    </div>
    <div class="card-input-row">
      <input class="price-input" type="number" id="inp-entry" placeholder="—" step="1"
             oninput="onInput('entry')" onfocus="onFocus('entry')">
      <span class="yen-label">円</span>
    </div>
  </div>

  <div class="connector">↕</div>

  <div class="card red" id="card-stop">
    <div class="card-header">
      <span class="card-label">損切りライン</span>
      <span class="card-badge" id="badge-stop">−0.5%</span>
    </div>
    <div class="card-input-row">
      <input class="price-input" type="number" id="inp-stop" placeholder="—" step="1"
             oninput="onInput('stop')" onfocus="onFocus('stop')">
      <span class="yen-label">円</span>
    </div>
  </div>
</div>

<div class="maxloss-row">
  <span class="maxloss-label">最大損失</span>
  <div style="flex:1">
    <div style="display:flex;align-items:baseline;justify-content:flex-end;gap:3px">
      <input class="maxloss-input" type="number" id="inp-maxloss" placeholder="—" step="1000" min="1"
             oninput="calcSharesFromLoss()">
      <span class="maxloss-unit">円</span>
    </div>
    <div class="maxloss-hint" id="hint-shares"></div>
  </div>
</div>

<div class="shares-row">
  <span class="shares-label">株数</span>
  <input class="shares-input" type="number" id="inp-shares" placeholder="—" step="100" min="1"
         oninput="calcLossFromShares()">
  <span class="shares-unit">株</span>
</div>

<div class="capital-row">
  <span class="capital-label">買付余力</span>
  <input class="capital-input" type="number" id="inp-capital" placeholder="—" step="10000" min="1"
         oninput="saveCapital()">
  <span class="capital-unit">円</span>
</div>

<div class="pnl-row" id="pnl-section" style="display:none">
  <div class="pnl-card profit">
    <div class="pnl-title">想定利益</div>
    <div class="pnl-value" id="pnl-profit">—</div>
  </div>
  <div class="pnl-card loss">
    <div class="pnl-title">想定損失</div>
    <div class="pnl-value" id="pnl-loss">—</div>
  </div>
</div>

<button class="btn-clear" onclick="clearAll()">クリア</button>

<script>
var lastEdited = 'entry';

function syncRatio(changed) {
  if (changed === 'profit') {
    var p = parseFloat(document.getElementById('profitPct').value) || 1.0;
    document.getElementById('stopPct').value = (p / 2).toFixed(1);
  } else {
    var s = parseFloat(document.getElementById('stopPct').value) || 0.5;
    document.getElementById('profitPct').value = (s * 2).toFixed(1);
  }
  saveSettings();
}

function getPct() {
  return {
    profit: parseFloat(document.getElementById('profitPct').value) || 1.0,
    stop:   parseFloat(document.getElementById('stopPct').value)   || 0.5
  };
}

function saveSettings() {
  localStorage.setItem('profitPct', document.getElementById('profitPct').value);
  localStorage.setItem('stopPct',   document.getElementById('stopPct').value);
}

function saveMaxloss() {
  var v = document.getElementById('inp-maxloss').value;
  if (v) localStorage.setItem('maxloss', v);
  else   localStorage.removeItem('maxloss');
}

function saveCapital() {
  var v = document.getElementById('inp-capital').value;
  if (v) localStorage.setItem('capital', v);
  else   localStorage.removeItem('capital');
}

function loadSaved() {
  var pp = localStorage.getItem('profitPct');
  var sp = localStorage.getItem('stopPct');
  var ml = localStorage.getItem('maxloss');
  var ca = localStorage.getItem('capital');
  if (pp) document.getElementById('profitPct').value    = pp;
  if (sp) document.getElementById('stopPct').value      = sp;
  if (ml) document.getElementById('inp-maxloss').value  = ml;
  if (ca) document.getElementById('inp-capital').value  = ca;
}

function onFocus(field) {
  ['profit','entry','stop'].forEach(function(f) {
    document.getElementById('card-' + f).classList.remove('active');
  });
  document.getElementById('card-' + field).classList.add('active');
}

function onInput(field) {
  lastEdited = field;
  calculate(field);
  var maxloss = parseFloat(document.getElementById('inp-maxloss').value);
  var shares  = parseFloat(document.getElementById('inp-shares').value);
  if (maxloss) { calcSharesFromLoss(); }
  else if (shares) { calcLossFromShares(); }
  updatePnl();
}

function recalcFromSettings() {
  updateBadges();
  saveSettings();
  calculate(lastEdited);
  var maxloss = parseFloat(document.getElementById('inp-maxloss').value);
  var shares  = parseFloat(document.getElementById('inp-shares').value);
  if (maxloss) { calcSharesFromLoss(); }
  else if (shares) { calcLossFromShares(); }
  updatePnl();
}

function calculate(source) {
  var pct = getPct();
  var pm = 1 + pct.profit / 100;
  var sm = 1 - pct.stop   / 100;
  var val = parseFloat(document.getElementById('inp-' + source).value);
  if (!val || isNaN(val)) return;

  var entry, profit, stop;
  if (source === 'entry') {
    entry = val; profit = val * pm; stop = val * sm;
  } else if (source === 'profit') {
    entry = val / pm; profit = val; stop = entry * sm;
  } else {
    entry = val / sm; profit = entry * pm; stop = val;
  }

  if (source !== 'profit') setVal('inp-profit', profit);
  if (source !== 'entry')  setVal('inp-entry',  entry);
  if (source !== 'stop')   setVal('inp-stop',   stop);
}

function setVal(id, val) {
  document.getElementById(id).value = (val && !isNaN(val)) ? Math.round(val) : '';
}

function updateBadges() {
  var pct = getPct();
  document.getElementById('badge-profit').textContent = '+' + pct.profit.toFixed(1) + '%';
  document.getElementById('badge-stop').textContent   = '−' + pct.stop.toFixed(1)   + '%';
}

function updatePnl() {
  var shares = parseFloat(document.getElementById('inp-shares').value);
  var entry  = parseFloat(document.getElementById('inp-entry').value);
  var profit = parseFloat(document.getElementById('inp-profit').value);
  var stop   = parseFloat(document.getElementById('inp-stop').value);
  var sec = document.getElementById('pnl-section');
  if (!shares || !entry || !profit || !stop) { sec.style.display = 'none'; return; }
  var pg = Math.round((profit - entry) * shares);
  var pl = Math.round((stop   - entry) * shares);
  document.getElementById('pnl-profit').textContent = '+¥' + pg.toLocaleString();
  document.getElementById('pnl-loss').textContent   = '−¥' + Math.abs(pl).toLocaleString();
  sec.style.display = 'grid';
}

function calcSharesFromLoss() {
  var maxloss = parseFloat(document.getElementById('inp-maxloss').value);
  var entry   = parseFloat(document.getElementById('inp-entry').value);
  var stop    = parseFloat(document.getElementById('inp-stop').value);
  if (!maxloss || !entry || !stop || entry <= stop) return;
  saveMaxloss();
  var lossPerShare = entry - stop;
  var rawShares    = Math.floor(maxloss / lossPerShare);
  var lotShares    = Math.floor(rawShares / 100) * 100;
  if (lotShares > 0) {
    document.getElementById('inp-shares').value = lotShares;
    updatePnl();
  }
}

function calcLossFromShares() {
  var shares = parseFloat(document.getElementById('inp-shares').value);
  var entry  = parseFloat(document.getElementById('inp-entry').value);
  var stop   = parseFloat(document.getElementById('inp-stop').value);
  if (!shares || !entry || !stop || entry <= stop) return;
  var ml = Math.round((entry - stop) * shares);
  document.getElementById('inp-maxloss').value = ml;
  saveMaxloss();
  updatePnl();
}

function clearAll() {
  ['inp-profit','inp-entry','inp-stop','inp-shares'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('pnl-section').style.display = 'none';
  ['profit','entry','stop'].forEach(function(f) {
    document.getElementById('card-' + f).classList.remove('active');
  });
  document.getElementById('card-entry').classList.add('active');
  lastEdited = 'entry';
}

updateBadges();
loadSaved();
updateBadges();
</script>
</body>
</html>
