<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>デイトレ計算</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700;900&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #00d4ff;
    --gain: #00ff88;
    --loss: #ff3355;
    --text: #e0e0f0;
    --muted: #505070;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  .header {
    width: 100%;
    max-width: 400px;
    margin-bottom: 28px;
    text-align: center;
  }

  .header h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
    opacity: 0.8;
  }

  .header p {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px;
    margin-bottom: 16px;
  }

  .input-section label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .input-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 28px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s;
    text-align: right;
    -webkit-appearance: none;
  }

  .input-row input:focus {
    border-color: var(--accent);
  }

  .input-row input::placeholder {
    color: var(--muted);
    font-size: 20px;
  }

  .input-row .unit {
    font-size: 14px;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    white-space: nowrap;
  }

  .settings-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 4px;
  }

  .setting-item label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .setting-item input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
    -webkit-appearance: none;
  }

  .setting-item input:focus {
    border-color: var(--accent);
  }

  .setting-item .pct {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 4px;
  }

  /* Results */
  .results {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .result-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 3px 0 0 3px;
  }

  .result-card.loss::before { background: var(--loss); }
  .result-card.gain::before { background: var(--gain); }
  .result-card.neutral::before { background: var(--accent); }

  .result-card.loss { border-color: rgba(255,51,85,0.2); }
  .result-card.gain { border-color: rgba(0,255,136,0.2); }
  .result-card.neutral { border-color: rgba(0,212,255,0.2); }

  .result-label {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .result-label .tag {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .result-label .name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .result-card.loss .name { color: var(--loss); }
  .result-card.gain .name { color: var(--gain); }
  .result-card.neutral .name { color: var(--accent); }

  .result-value {
    text-align: right;
  }

  .result-value .price {
    font-family: 'Share Tech Mono', monospace;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .result-card.loss .price { color: var(--loss); }
  .result-card.gain .price { color: var(--gain); }
  .result-card.neutral .price { color: var(--accent); }

  .result-value .sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
    letter-spacing: 0.1em;
  }

  /* Shares section */
  .shares-section {
    margin-top: 4px;
  }

  .shares-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  .shares-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 20px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    text-align: right;
    -webkit-appearance: none;
  }

  .shares-input:focus { border-color: var(--accent); }

  .pnl-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }

  .pnl-item {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    border: 1px solid var(--border);
  }

  .pnl-item .pnl-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .pnl-item.loss-pnl .pnl-label { color: var(--loss); opacity: 0.7; }
  .pnl-item.gain-pnl .pnl-label { color: var(--gain); opacity: 0.7; }

  .pnl-item .pnl-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 17px;
  }

  .pnl-item.loss-pnl .pnl-val { color: var(--loss); }
  .pnl-item.gain-pnl .pnl-val { color: var(--gain); }

  .divider {
    width: 100%;
    max-width: 400px;
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  /* Tap to copy feedback */
  .copy-hint {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.1em;
    margin-top: -4px;
    opacity: 0.6;
  }

  .copied-toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    padding: 8px 20px;
    border-radius: 20px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 99;
  }

  .copied-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>DAYTRADE CALC</h1>
  <p>買値から損切り・利確を即算出</p>
</div>

<!-- 買値入力 -->
<div class="card">
  <label style="display:block;font-size:11px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;">買値</label>
  <div class="input-row">
    <input type="number" id="buyPrice" placeholder="0" inputmode="decimal" autofocus>
    <span class="unit">円</span>
  </div>

  <!-- 設定 -->
  <div class="settings-row">
    <div class="setting-item">
      <label>損切り</label>
      <input type="number" id="lossRate" value="0.5" step="0.1" inputmode="decimal">
      <div class="pct">%</div>
    </div>
    <div class="setting-item">
      <label>利確</label>
      <input type="number" id="gainRate" value="1.0" step="0.1" inputmode="decimal">
      <div class="pct">%</div>
    </div>
  </div>

  <!-- 株数（任意） -->
  <div class="shares-section" style="margin-top:16px;">
    <span class="shares-label">株数（任意・損益額を計算）</span>
    <input type="number" id="shares" class="shares-input" placeholder="100" inputmode="numeric">
  </div>
</div>

<!-- 結果 -->
<div class="results" id="results">
  <div class="empty-state">買値を入力してください</div>
</div>

<p class="copy-hint" id="copyHint" style="display:none;">価格をタップでコピー</p>

<div class="copied-toast" id="toast">COPIED</div>

<script>
  const buyInput = document.getElementById('buyPrice');
  const lossInput = document.getElementById('lossRate');
  const gainInput = document.getElementById('gainRate');
  const sharesInput = document.getElementById('shares');
  const resultsEl = document.getElementById('results');
  const copyHint = document.getElementById('copyHint');
  const toast = document.getElementById('toast');

  function fmt(n) {
    return n.toLocaleString('ja-JP', { minimumFractionDigits: 0, maximumFractionDigits: 1 });
  }

  function fmtPnl(n) {
    const sign = n >= 0 ? '+' : '';
    return sign + n.toLocaleString('ja-JP', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  function calc() {
    const buy = parseFloat(buyInput.value);
    const lossRate = parseFloat(lossInput.value) || 0.5;
    const gainRate = parseFloat(gainInput.value) || 1.0;
    const shares = parseInt(sharesInput.value) || 0;

    if (!buy || buy <= 0) {
      resultsEl.innerHTML = '<div class="empty-state">買値を入力してください</div>';
      copyHint.style.display = 'none';
      return;
    }

    const lossPrice = buy * (1 - lossRate / 100);
    const gainPrice = buy * (1 + gainRate / 100);
    const rr = (gainRate / lossRate).toFixed(1);

    let pnlHTML = '';
    if (shares > 0) {
      const lossPnl = Math.round((lossPrice - buy) * shares);
      const gainPnl = Math.round((gainPrice - buy) * shares);
      pnlHTML = `
        <div class="pnl-row">
          <div class="pnl-item loss-pnl">
            <div class="pnl-label">損失額</div>
            <div class="pnl-val">${fmtPnl(lossPnl)}円</div>
          </div>
          <div class="pnl-item gain-pnl">
            <div class="pnl-label">利益額</div>
            <div class="pnl-val">${fmtPnl(gainPnl)}円</div>
          </div>
        </div>`;
    }

    resultsEl.innerHTML = `
      <div class="result-card gain" onclick="copyVal('${fmt(gainPrice)}')">
        <div class="result-label">
          <span class="tag">利確 +${gainRate}%</span>
          <span class="name">指値</span>
        </div>
        <div class="result-value">
          <div class="price">${fmt(gainPrice)}</div>
          <div class="sub">円</div>
        </div>
      </div>

      <div class="result-card neutral" onclick="copyVal('${fmt(buy)}')">
        <div class="result-label">
          <span class="tag">エントリー</span>
          <span class="name">買値</span>
        </div>
        <div class="result-value">
          <div class="price">${fmt(buy)}</div>
          <div class="sub">円</div>
        </div>
      </div>

      <div class="result-card loss" onclick="copyVal('${fmt(lossPrice)}')">
        <div class="result-label">
          <span class="tag">損切り −${lossRate}%</span>
          <span class="name">逆指値</span>
        </div>
        <div class="result-value">
          <div class="price">${fmt(lossPrice)}</div>
          <div class="sub">円</div>
        </div>
      </div>

      ${shares > 0 ? `<div class="card" style="margin-bottom:0;padding:14px 20px;">${pnlHTML}</div>` : ''}
    `;

    copyHint.style.display = 'block';
  }

  function copyVal(val) {
    const num = val.replace(/,/g, '');
    navigator.clipboard.writeText(num).then(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1200);
    }).catch(() => {
      // fallback
      const el = document.createElement('textarea');
      el.value = num;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1200);
    });
  }

  buyInput.addEventListener('input', calc);
  lossInput.addEventListener('input', calc);
  gainInput.addEventListener('input', calc);
  sharesInput.addEventListener('input', calc);
</script>
</body>
</html>
